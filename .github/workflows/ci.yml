name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder connection string so the Prisma client can be constructed
      # during the build. CI never connects to a database: no migration runs
      # here and every build-time query is wrapped in a try/catch.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      # The logic suites below need no database and no development server.
      # They are listed explicitly and must not be swapped for `npm test`:
      # `npm test` also pulls in the integration suites, which need a live
      # server on localhost:3001 and a writable database. Those suites would
      # fail here, or worse, skip and report a green result while proving
      # nothing.
      #
      # Every suite in this list passes with no database and without a `.env`
      # file. A suite that needs a database is deliberately absent.
      - name: Logic tests
        run: |
          node --test --test-concurrency=1 \
            scripts/prisma-guard.test.mjs \
            scripts/prisma-target.test.mjs \
            scripts/eligibility.test.mjs \
            scripts/module-syntax.test.mjs \
            scripts/attendance-rules.test.mjs \
            scripts/profile-fields.test.mjs \
            scripts/attendance-service.test.mjs \
            scripts/account-service.test.mjs \
            scripts/account-deactivation.test.mjs \
            scripts/audit-hash-key.test.mjs \
            scripts/profile-photo.test.mjs \
            scripts/profile-service.test.mjs

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
